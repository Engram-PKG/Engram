# Dev frontend server (docker-compose `frontend`). Same as nginx:alpine's default site,
# plus Cache-Control: no-cache so browsers revalidate (cheap 304 via ETag) on every load
# instead of silently reusing a stale CSS/JS file after it's edited.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
