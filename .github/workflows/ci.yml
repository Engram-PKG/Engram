name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Type-check & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: digitaltwin
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: digitaltwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://digitaltwin:changeme@localhost:5432/digitaltwin
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-not-real

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff — lint
        run: ruff check backend/

      - name: Ruff — format check
        run: ruff format --check backend/

      - name: Mypy — type check
        working-directory: backend
        run: mypy app

      - name: Alembic — run migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Pytest — run tests
        working-directory: backend
        run: pytest
